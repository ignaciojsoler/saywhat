<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saywhat — captions that pop</title>
<style>
  body{font:14px system-ui,sans-serif;margin:20px;background:#111;color:#eee}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0}
  label{display:flex;gap:6px;align-items:center}
  button{padding:6px 10px;cursor:pointer}
  input,select{background:#1c1c1c;color:#eee;border:1px solid #333;padding:5px;font:inherit}
  #main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:900px){#main{grid-template-columns:1fr}}
  #stage{position:relative;background:#000;max-width:720px}
  #stage video{width:100%;display:block}
  #cap{position:absolute;left:5%;right:5%;text-align:center;pointer-events:none;
       font-weight:900;line-height:1.15;color:#fff;
       text-shadow:0 0 6px #000,0 2px 4px #000,0 0 2px #000}
  #cap .w{display:inline-block;margin:0 .12em;transition:transform .08s,color .08s}
  #cap.karaoke .w.done{color:#fff}
  #cap.karaoke .w.todo{color:#fff9}
  #cap .w.on{color:#ffe14d}
  #cap.pop .w.on{transform:scale(1.25)}
  #cap.single .w{font-size:1.6em}
  #editor{max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
  .line{display:flex;gap:6px;align-items:center;padding:3px;border-left:3px solid transparent}
  .line.active{border-left-color:#ffe14d;background:#1d1d1d}
  .line button{font-variant-numeric:tabular-nums;min-width:62px}
  .line input{flex:1}
  .muted{color:#999}
  .brand{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
  .brand b{font-size:28px;letter-spacing:-.02em;color:#ffe14d}
  .brand span{color:#bbb}
</style>
</head>
<body>
<header class="brand"><b>Saywhat</b><span>captions that pop</span></header>
<p class="muted" style="margin-top:0">Subí un video corto: subtítulos animados palabra por palabra, editables, y export .srt. El video nunca sale de tu navegador.</p>

<div class="row">
  <input type="file" id="file" accept="video/*">
  <button id="go" disabled>Transcribir</button>
  <span id="status" class="muted">Subí un video corto (máx. 90 s)</span>
</div>

<div class="row">
  <label>Estilo
    <select id="style">
      <option value="karaoke">Karaoke</option>
      <option value="pop">Pop (palabra activa crece)</option>
      <option value="single">Una palabra</option>
      <option value="classic">Clásico</option>
    </select>
  </label>
  <label>Palabras por línea <input id="per" type="number" min="1" max="8" value="3" style="width:48px"></label>
  <label>Tamaño <input id="size" type="range" min="16" max="64" value="34"></label>
  <label>Posición <input id="pos" type="range" min="5" max="80" value="12"></label>
  <button id="srt" disabled>Exportar .srt</button>
</div>

<div id="main">
  <div id="stage"><video id="video" controls playsinline></video><div id="cap" class="karaoke"></div></div>
  <div>
    <div class="muted" style="margin-bottom:6px">Transcripción: click en el tiempo para saltar, editá el texto y Enter para aplicar.</div>
    <div id="editor"></div>
  </div>
</div>

<script>
{
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const video = $('video'), cap = $('cap');
const MAX_SEC = 90;

let file = null;
let words = [];     // fuente de verdad: [{w, s, e}]
let lines = [];     // rangos derivados [[i0, i1), ...]

// ---------- audio: video → WAV 16 kHz mono (todo en el navegador) ----------
async function videoToWav(f) {
  const ctx = new AudioContext();
  const decoded = await ctx.decodeAudioData(await f.arrayBuffer());
  ctx.close();
  const sr = 16000, len = Math.ceil(decoded.duration * sr);
  const off = new OfflineAudioContext(1, len, sr);          // remuestrea y baja a mono
  const src = off.createBufferSource();
  src.buffer = decoded; src.connect(off.destination); src.start();
  const data = (await off.startRendering()).getChannelData(0);

  const b = new ArrayBuffer(44 + data.length * 2), v = new DataView(b);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + data.length * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, data.length * 2, true);
  for (let i = 0; i < data.length; i++) {
    const s = Math.max(-1, Math.min(1, data[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([b], { type: 'audio/wav' });
}

$('file').onchange = e => {
  file = e.target.files[0]; if (!file) return;
  words = []; lines = []; renderEditor(); cap.innerHTML = '';
  video.src = URL.createObjectURL(file);
  video.onloadedmetadata = () => {
    const ok = video.duration <= MAX_SEC;
    $('go').disabled = !ok;
    $('status').textContent = ok ? `${video.duration.toFixed(1)} s — listo para transcribir` : `Dura ${Math.round(video.duration)} s; el máximo es ${MAX_SEC} s`;
  };
};

$('go').onclick = async () => {
  $('go').disabled = true;
  try {
    $('status').textContent = 'Extrayendo audio…';
    const wav = await videoToWav(file);
    $('status').textContent = `Transcribiendo (${(wav.size / 1e6).toFixed(1)} MB)…`;
    const r = await fetch('/api/transcribe', { method: 'POST', headers: { 'Content-Type': 'audio/wav' }, body: wav });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.statusText);
    if (!d.words?.length) throw new Error('No se detectó habla');
    words = d.words;
    regroup();
    $('status').textContent = `${words.length} palabras` + (d.source === 'vtt' ? ' (tiempos aproximados por frase)' : '');
    $('srt').disabled = false;
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
  }
  $('go').disabled = false;
};

// ---------- agrupar palabras en líneas ----------
function regroup() {
  const per = Math.max(1, +$('per').value || 3);
  lines = [];
  let start = 0;
  for (let i = 1; i <= words.length; i++) {
    const gap = i < words.length ? words[i].s - words[i - 1].e : 0;
    if (i === words.length || i - start >= per || gap > 0.6 || /[.?!]$/.test(words[i - 1].w)) {
      lines.push([start, i]); start = i;
    }
  }
  lastKey = ''; renderEditor();
}
$('per').onchange = () => words.length && regroup();

const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
function renderEditor() {
  $('editor').innerHTML = lines.map(([a, b], k) => `
    <div class="line" data-k="${k}">
      <button data-seek="${words[a].s}">${fmt(words[a].s)}</button>
      <input value="${esc(words.slice(a, b).map(w => w.w).join(' '))}">
    </div>`).join('');
}

// click en el tiempo → saltar
$('editor').addEventListener('click', e => {
  const t = e.target.dataset.seek; if (t == null) return;
  video.currentTime = +t + 0.01; video.play();
});

// editar una línea: misma cantidad de palabras → conserva tiempos; si cambia, reparte el tramo
$('editor').addEventListener('change', e => {
  const row = e.target.closest('.line'); if (!row || e.target.tagName !== 'INPUT') return;
  const [a, b] = lines[+row.dataset.k];
  const toks = e.target.value.trim().split(/\s+/).filter(Boolean);
  const old = words.slice(a, b);
  let repl;
  if (toks.length === old.length) repl = old.map((w, i) => ({ ...w, w: toks[i] }));
  else {
    const s = old[0].s, d = (old[old.length - 1].e - s) / (toks.length || 1);
    repl = toks.map((w, i) => ({ w, s: s + i * d, e: s + (i + 1) * d }));
  }
  words.splice(a, b - a, ...repl);
  if (!words.length) { lines = []; renderEditor(); return; }
  regroup();
});

// ---------- overlay en vivo ----------
let lastKey = '';
function activeLine(t) {
  let k = -1;
  for (let i = 0; i < lines.length; i++) {
    if (words[lines[i][0]].s - 0.05 <= t) k = i; else break;
  }
  if (k < 0) return -1;
  const end = words[lines[k][1] - 1].e;
  return t <= end + 0.4 ? k : -1;           // mantener la línea un instante después de terminar
}

function tick() {
  const t = video.currentTime, style = $('style').value;
  cap.className = style;
  cap.style.fontSize = $('size').value + 'px';
  cap.style.bottom = $('pos').value + '%';

  const k = lines.length ? activeLine(t) : -1;
  let on = -1;
  if (k >= 0) {
    const [a, b] = lines[k];
    for (let i = a; i < b; i++) if (words[i].s <= t) on = i;   // última palabra ya dicha
  }
  const key = `${k}|${on}|${style}`;
  if (key !== lastKey) {
    lastKey = key;
    if (k < 0) cap.innerHTML = '';
    else {
      const [a, b] = lines[k];
      if (style === 'single') cap.innerHTML = on >= 0 ? `<span class="w on">${esc(words[on].w)}</span>` : '';
      else if (style === 'classic') cap.innerHTML = esc(words.slice(a, b).map(w => w.w).join(' '));
      else cap.innerHTML = words.slice(a, b).map((w, j) => {
        const i = a + j;
        const cls = i === on ? 'on' : i < on ? 'done' : 'todo';
        return `<span class="w ${cls}">${esc(w.w)}</span>`;
      }).join('');
    }
    document.querySelectorAll('.line.active').forEach(el => el.classList.remove('active'));
    const row = document.querySelector(`.line[data-k="${k}"]`);
    if (row) { row.classList.add('active'); if (!video.paused) row.scrollIntoView({ block: 'nearest' }); }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- export SRT ----------
const srtTime = t => {
  const ms = Math.round(t * 1000);
  const p = (n, l = 2) => String(n).padStart(l, '0');
  return `${p(Math.floor(ms / 3600000))}:${p(Math.floor(ms / 60000) % 60)}:${p(Math.floor(ms / 1000) % 60)},${p(ms % 1000, 3)}`;
};
$('srt').onclick = () => {
  const srt = lines.map(([a, b], k) =>
    `${k + 1}\n${srtTime(words[a].s)} --> ${srtTime(words[b - 1].e)}\n${words.slice(a, b).map(w => w.w).join(' ')}\n`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([srt], { type: 'text/plain' }));
  a.download = 'subtitulos.srt'; a.click();
};
}
</script>
</body>
</html>
